[build]
  command = "npm run build"
  publish = "dist"

# API: data master (/api/data/*), aktivitas sales (/api/aktivitas), login & RBAC (/api/auth/*, /api/pengguna, /api/peran).
# Env: NETLIFY_DATABASE_URL atau DATABASE_URL (Neon Postgres gratis); SUPERADMIN_EMAIL + SUPERADMIN_PASSWORD (akun pertama).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA: semua path (/admin, /sales/kunjungan/...) dilayani index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
