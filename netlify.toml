[build]
  command = "npm run build"
  publish = "dist"

# API sinkron data master (netlify/functions/data.mts → /api/data/*).
# Env: NETLIFY_DATABASE_URL atau DATABASE_URL (Neon Postgres gratis), ADMIN_TOKEN.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA: semua path (/admin, /sales/kunjungan/...) dilayani index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
